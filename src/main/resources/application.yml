server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Stockeate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: localhost
      port: 6379
  
security:
  jwt:
    secret-key: 0DNJ1N4u8v7yXmEKRhNf567OJUuvL4RvEKSUmkDZxp0QkTAn
    expiration-time: 3600000

app:
  search:
    max-results: ${SEARCH_MAX_RESULTS:50}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    session-timeout-minutes: ${SESSION_TIMEOUT_MINUTES:60}