server:
  port: 8080

spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockeate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: localhost
      port: 6379
  
security:
  jwt:
    # Obligatorio: setear JWT_SECRET_KEY como variable de entorno (mínimo 256 bits, Base64).
    # No se define un valor por defecto: si falta, la app falla al arrancar.
    secret-key: ${JWT_SECRET_KEY:}
    expiration-time: 900000
    refresh-expiration-days: 7

app:
  search:
    max-results: ${SEARCH_MAX_RESULTS:50}
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    session-timeout-minutes: ${SESSION_TIMEOUT_MINUTES:60}